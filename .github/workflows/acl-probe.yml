name: ACL 점검 — 송출

# 외부에서 신규 서버로 UDP 프로브를 쏘고 ACK 로 판정한다.
#
# 지속 시간 내 서로 다른 포트의 ACK 가 임계(min_acks)에 못 미치면 프로버가
# 3 으로 죽어 이 잡이 실패한다. 서버 아웃바운드만 막힌 경우에도 실패하는
# 오탐은 인지하고 감수한 결정이다 (설계 2026-08-20-probe-ack-verdict).
# no_ack 를 켠 실행의 성공은 송신 완료만 뜻하며 판정이 아니다.

on:
  workflow_dispatch:
    inputs:
      public_target:
        description: '외부 접점 IP 또는 공인 DNS 이름 (수신 측과 같은 장비여야 합니다)'
        required: true
        type: string
      duration:
        description: '총 송신 지속(초)'
        required: false
        default: '300'
        type: string
      interval:
        description: '버스트 간격(초)'
        required: false
        default: '5'
        type: string
      min_acks:
        description: '판정 임계값 — 이만큼 서로 다른 포트에서 ACK 를 받으면 조기 종료, 못 받으면 실패'
        required: false
        default: '5'
        type: string
      no_ack:
        description: 'ACK 를 기다리지 않고 쏘고 잊는다 (판정 없음·조기 종료 없음)'
        required: false
        default: false
        type: boolean
      force:
        description: '사전 점검 실패에도 강행'
        required: false
        default: false
        type: boolean

jobs:
  # 반드시 GitHub-hosted 여야 한다.
  #
  # self-hosted 로 옮기면 사내망에서 사내 서버로 쏘게 되어
  # 외부 ACL 을 전혀 검증하지 못하면서 게이트는 통과한다.
  # 러너 통합·비용 절감 같은 이유로 이 변경이 제안되기 쉬우므로 주의한다.
  # 방어책: 프로버가 보낸 SRC 가 사내 대역이면 리스너가 경고를 낸다.
  probe:
    name: 송출
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.public_target }}
      DURATION: ${{ inputs.duration }}
      INTERVAL: ${{ inputs.interval }}
      MIN_ACKS: ${{ inputs.min_acks }}
      NO_ACK_INPUT: ${{ inputs.no_ack }}
      FORCE_INPUT: ${{ inputs.force }}
    steps:
      # v5 부터 Node 24 런타임이다. v4(Node 20)는 폐지 예정.
      # self-hosted 러너는 v2.327.1 이상이어야 node24 를 제공한다.
      - uses: actions/checkout@v5

      - name: 프로브 송신
        run: |
          set -o pipefail
          args=(--target "$TARGET" --duration "$DURATION" --interval "$INTERVAL"
                --min-acks "$MIN_ACKS")
          if [ "$FORCE_INPUT" = "true" ]; then
            args+=(--force)
          fi
          if [ "$NO_ACK_INPUT" = "true" ]; then
            args+=(--no-ack)
          fi
          # 이 워크플로는 내보낸 저장소에서 돈다. 거기서는 workflow/ 안이
          # 저장소 루트이므로 프로버가 루트에 있다. 원본 저장소에서 이 줄만
          # 보면 경로가 틀려 보이지만 맞는 것이다.
          #
          # bash 로 명시 호출한다. 실행 권한 비트에 의존하지 않는다.
          # 체크아웃·zip 다운로드·파일 복사 등 파일이 어떤 경로로 왔든 동작해야 한다.
          bash acl-probe "${args[@]}" 2>&1 | tee probe.log

      # 프로버가 마지막에 내보내는 ACL_PROBE_RESULT 한 줄만 읽는다.
      # 한글 문장을 파싱하지 않으므로 문구가 바뀌어도 깨지지 않는다.
      - name: ACK 결과 기록
        id: result
        if: always()
        run: |
          line="$(grep -m1 '^ACL_PROBE_RESULT ' probe.log 2>/dev/null || true)"

          if [ -z "$line" ]; then
            echo "::warning title=송출 결과::ACL_PROBE_RESULT 줄을 찾지 못했습니다. 프로버가 중간에 죽었을 수 있습니다."
            {
              echo "acks=unknown"
              echo "ack_mode=unknown"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "key=value" 토큰에서 값 하나를 꺼낸다.
          field() {
            printf '%s\n' "$line" | tr ' ' '\n' | sed -n "s/^$1=//p" | head -n1
          }

          sent=$(field sent)
          bursts_done=$(field bursts_done)
          bursts_total=$(field bursts_total)
          ack_mode=$(field ack_mode)
          acks=$(field acks)
          min_acks=$(field min_acks)
          early=$(field early)
          src=$(field src)
          preflight=$(field preflight)

          # 뒤따르는 스텝·잡이 쓸 수 있게 출력값으로 남긴다.
          {
            echo "sent=$sent"
            echo "acks=$acks"
            echo "min_acks=$min_acks"
            echo "ack_mode=$ack_mode"
            echo "early=$early"
          } >> "$GITHUB_OUTPUT"

          # job 로그에 한 줄로 남기고 실행 주석으로도 띄운다.
          # ACK 는 판정 기준이다 — 임계 미달이면 프로버가 3 으로 죽어 잡이 붉어지고,
          # 이 스텝은 if: always() 로 돌아 실패 해석을 주석에 남긴다.
          if [ "$ack_mode" = "1" ]; then
            if [ "$early" = "1" ]; then
              echo "::notice title=ACK 수신::서로 다른 ${acks}개 포트에서 ACK 회신 (임계 ${min_acks}) — 조기 종료, ${sent}발 송신"
            else
              echo "::error title=ACK 판정 실패::서로 다른 ${acks}개 포트에서만 ACK 회신 (임계 ${min_acks} 미달) — 수신 측 acl-listen 이 PASS 라면 서버 아웃바운드 UDP 차단 신호입니다"
            fi
          else
            echo "::notice title=ACK 수신::ACK 대기 없음(--no-ack, 판정 없음) — ${sent}발 송신"
          fi

          {
            echo '## ACL 점검 — 송출 결과'
            echo
            if [ "$ack_mode" = "1" ]; then
              echo "### ACK: 서로 다른 **${acks}개** 포트에서 회신 (임계 ${min_acks})"
            else
              echo '### ACK 대기 없음 (`--no-ack`)'
            fi
            echo
            echo '| 항목 | 값 |'
            echo '|---|---|'
            echo "| 송신 발수 | ${sent} |"
            echo "| 버스트 | ${bursts_done} / ${bursts_total} |"
            echo "| ACK 회신 포트 수 | ${acks} |"
            echo "| ACK 임계값 | ${min_acks} |"
            echo "| 조기 종료 | $( [ "$early" = "1" ] && echo '예' || echo '아니오' ) |"
            echo "| 송출 소스 IP | ${src} |"
            echo "| 사전 점검 | ${preflight} |"
            echo
            echo '> **ACK 는 판정 기준입니다.** 임계 미달이면 프로버가 종료코드 3 으로 실패합니다.'
            echo '> 이 실패는 인바운드 차단·리스너 미기동·서버 아웃바운드 차단을 구분하지 못합니다.'
            echo '> 수신 측(`acl-listen`)이 PASS 인데 이 잡이 실패했다면 아웃바운드 차단 신호입니다.'
            echo '>'
            echo '> `--no-ack` 실행의 성공은 송신 완료만 뜻하며 판정이 아닙니다.'
            echo '>'
            echo '> 사전 점검이 성공했어도 UDP 53 만 증명하며 고포트 egress 의 보증은 아닙니다.'
            echo
            echo '<details><summary>전체 로그</summary>'
            echo
            echo '```'
            cat probe.log 2>/dev/null || echo '(로그 없음)'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
